name: CI
on:
  push:
    branches: [stackline]
  pull_request:
    branches: [stackline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: stackline-ci
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - name: Exercise upstream terminal fixtures outside CI detection
        run: CI=false npx --no-install ava 'test/*.js'
      - run: node --test scripts/stackline-ci-contract.test.mjs
      - run: python3 scripts/stackline-pack.py
      - run: node scripts/stackline-test-packed.mjs
      - run: node --test scripts/registry-requests.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: artifact/*
          if-no-files-found: error
